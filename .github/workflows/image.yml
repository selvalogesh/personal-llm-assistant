# Tests, then builds the server image and pushes it to GHCR on every push to main (merged pull requests included).
# The server's OMV Compose stack "Chat" pulls ghcr.io/selvalogesh/personal-llm-assistant:latest (deploy/README.md).
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch: # rebuild by hand; only a run on main moves :latest

# One run at a time, so :latest always ends on the newest commit.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No type=gha cache: in finance-analysis it failed the first run ("failed to reserve cache"), and a failed
          # cache export cancels the push.
